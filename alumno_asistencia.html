<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empresa — Registrar asistencia</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f6f7f8;margin:0;color:#111}
main{max-width:520px;margin:32px auto;padding:16px}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:22px}
h1{font-size:1.6rem;margin:0 0 8px}
p{line-height:1.45}
label{display:block;font-weight:700;margin-top:14px}
input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #bbb;border-radius:8px;font-size:1rem}
button{width:100%;padding:13px;margin-top:16px;border:1px solid #999;border-radius:9px;background:#fff;font-size:1rem;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
#status{margin-top:18px;padding:14px;border:1px solid #ddd;border-radius:9px;background:#fafafa;white-space:pre-wrap}
.small{font-size:.9rem;color:#555}
</style>
</head>
<body>
<main>
<div class="card">
<h1>Empresa — Asistencia</h1>
<p>Identifícate para registrar tu asistencia.</p>

<label for="email">Correo</label>
<input id="email" type="email" autocomplete="username">

<label for="password">Contraseña de prueba</label>
<input id="password" type="password" autocomplete="current-password">

<button id="registerBtn" disabled>Registrar mi asistencia</button>

<div id="status">Validando el QR…</div>
<p class="small">El QR se valida al escanearlo. Después dispones de 90 segundos para completar la identificación.</p>
</div>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL='https://twpommdfpcdwznqoqiaj.supabase.co';
const SUPABASE_KEY='sb_publishable_y7qK9547paLvOTItxEPoCA_wKMb27JX';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);

const qs=new URLSearchParams(location.search);
const windowId=qs.get('w');
const token=qs.get('t');

const status=document.getElementById('status');
const registerBtn=document.getElementById('registerBtn');

let ticketId=null;
let ticketExpiresAt=null;

function setStatus(msg){ status.textContent=msg; }

function getOrCreateDeviceKey(){
  const storageKey='empresa_attendance_device_key';
  let key=localStorage.getItem(storageKey);
  if(!key){
    key=crypto.randomUUID();
    localStorage.setItem(storageKey,key);
  }
  return key;
}

async function claimQrImmediately(){
  if(!windowId || !token){
    setStatus('QR incompleto o no válido.');
    return;
  }

  setStatus('Validando el QR…');

  const {data,error}=await supabase.rpc('claim_attendance_qr',{
    p_window_id:windowId,
    p_qr_token:token
  });

  if(error){
    setStatus('El QR ha caducado. Escanea el código que aparece ahora en la pantalla.');
    return;
  }

  const row=Array.isArray(data) ? data[0] : data;
  ticketId=row?.ticket_id ?? null;
  ticketExpiresAt=row?.expires_at ?? null;

  if(!ticketId){
    setStatus('No se ha podido crear el permiso temporal.');
    return;
  }

  registerBtn.disabled=false;
  setStatus('QR validado. Tienes 90 segundos para identificarte y registrar tu asistencia.');
}

registerBtn.addEventListener('click', async()=>{
  if(!ticketId){
    setStatus('No existe un permiso temporal válido. Vuelve a escanear el QR.');
    return;
  }

  if(ticketExpiresAt && Date.now() >= new Date(ticketExpiresAt).getTime()){
    registerBtn.disabled=true;
    setStatus('El permiso temporal ha caducado. Vuelve a escanear el QR.');
    return;
  }

  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;

  if(!email || !password){
    setStatus('Introduce el correo y la contraseña de prueba.');
    return;
  }

  registerBtn.disabled=true;
  setStatus('Comprobando identidad…');

  const login=await supabase.auth.signInWithPassword({email,password});
  if(login.error){
    registerBtn.disabled=false;
    setStatus('No se ha podido iniciar sesión:\n'+login.error.message);
    return;
  }

  const link=await supabase.rpc('link_current_user_to_student');
  if(link.error){
    registerBtn.disabled=false;
    setStatus('No se ha podido vincular el alumno:\n'+link.error.message);
    return;
  }

  setStatus('Comprobando dispositivo…');

  const deviceKey=getOrCreateDeviceKey();
  const device=await supabase.rpc('register_or_validate_my_device',{
    p_device_key:deviceKey
  });

  if(device.error){
    registerBtn.disabled=false;
    setStatus('No se ha podido comprobar el dispositivo:\n'+device.error.message);
    return;
  }

  const deviceResult=typeof device.data==='string'
    ? device.data
    : Array.isArray(device.data)
      ? String(device.data[0] ?? '')
      : String(device.data ?? '');

  if(deviceResult.includes('DEVICE_MISMATCH')){
    registerBtn.disabled=false;
    setStatus('Este alumno ya tiene otro dispositivo registrado. Contacta con el profesor si has cambiado de móvil.');
    return;
  }

  if(deviceResult.includes('DEVICE_REVOKED')){
    registerBtn.disabled=false;
    setStatus('Este dispositivo fue desactivado por el profesor. Utiliza el nuevo dispositivo autorizado o contacta con el profesor.');
    return;
  }

  if(deviceResult.includes('DEVICE_KEY_IN_USE')){
    registerBtn.disabled=false;
    setStatus('Este dispositivo está asociado a otra cuenta. Contacta con el profesor.');
    return;
  }

  if(!deviceResult.includes('DEVICE_OK') && !deviceResult.includes('DEVICE_REGISTERED')){
    registerBtn.disabled=false;
    setStatus('No se ha podido validar el dispositivo. Respuesta: '+deviceResult);
    return;
  }

  setStatus('Registrando asistencia…');

  const reg=await supabase.rpc('register_my_attendance_with_ticket',{
    p_ticket_id:ticketId
  });

  if(reg.error){
    registerBtn.disabled=false;
    setStatus('No se ha podido registrar la asistencia:\n'+reg.error.message);
    return;
  }

  const result=typeof reg.data==='string'
    ? reg.data
    : Array.isArray(reg.data)
      ? JSON.stringify(reg.data[0] ?? reg.data)
      : JSON.stringify(reg.data);

  if(result.includes('ALREADY_REGISTERED')){
    setStatus('✓ Tu asistencia ya estaba registrada.');
  } else if(result.includes('REGISTERED')){
    setStatus('✓ ASISTENCIA REGISTRADA');
  } else if(result.includes('NOT_ENROLLED')){
    setStatus('No constas matriculado en este grupo.');
  } else if(result.includes('TICKET_EXPIRED')){
    setStatus('El permiso temporal ha caducado. Vuelve a escanear el QR.');
  } else if(result.includes('TICKET_USED')){
    setStatus('Este acceso ya se utilizó. Si tu asistencia no quedó registrada, vuelve a escanear.');
  } else {
    setStatus('Respuesta del servidor:\n'+result);
  }
});

claimQrImmediately();
</script>
</body>
</html>
